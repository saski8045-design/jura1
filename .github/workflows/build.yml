          cat > app/src/main/res/drawable/ic_logo.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#040904" android:pathData="M54,54m-50,0a50,50 0 1,0 100,0a50,50 0 1,0 -100,0"/>
              <path android:fillColor="#0A1F0A" android:pathData="M54,54m-38,0a38,38 0 1,0 76,0a38,38 0 1,0 -76,0"/>
              <path android:strokeColor="#39FF14" android:strokeWidth="2.5" android:fillColor="#00000000"
                  android:pathData="M54,54m-28,0a28,28 0 1,0 56,0a28,28 0 1,0 -56,0"/>
              <path android:strokeColor="#39FF14" android:strokeWidth="3.5" android:strokeLineCap="round"
                  android:pathData="M42,50L42,58M48,45L48,63M54,40L54,68M60,45L60,63M66,50L66,58"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_notif.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:strokeColor="#FFFFFF" android:strokeWidth="2" android:strokeLineCap="round"
                  android:pathData="M4,10L4,14M8,7L8,17M12,4L12,20M16,7L16,17M20,10L20,14"/>
