                      val res = out
                      h.post { speak(res) }
                  }.start()
              }

              private fun callGemini(key: String, sys: String, hist: JSONArray, q: String): String {
                  val contents = JSONArray()
                  for (i in 0 until hist.length()) {
                      val m = hist.getJSONObject(i)
                      val role = if (m.getString("role") == "user") "user" else "model"
                      contents.put(JSONObject().put("role", role).put("parts", JSONArray().put(JSONObject().put("text", m.getString("content")))))
                  }
                  contents.put(JSONObject().put("role", "user").put("parts", JSONArray().put(JSONObject().put("text", q))))
                  val models = listOf("gemini-3.8-flash", "gemini-2.5-flash")
                  var lastCode = 0
                  var lastBody = ""
                  for (model in models) {
                      for (attempt in 0..1) {
                          val gen = JSONObject().put("maxOutputTokens", 1024)
                          if (attempt == 0) gen.put("thinkingConfig", JSONObject().put("thinkingLevel", "low"))
                          val body = JSONObject()
                              .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", sys))))
                              .put("contents", contents)
                              .put("generationConfig", gen)
                          val con = URL("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent").openConnection() as HttpURLConnection
                          con.requestMethod = "POST"
                          con.connectTimeout = 10000
                          con.readTimeout = 30000
                          con.doOutput = true
                          con.setRequestProperty("content-type", "application/json")
                          con.setRequestProperty("x-goog-api-key", key)
                          con.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                          val code = con.responseCode
                          if (code == 200) {
                              val txt = con.inputStream.bufferedReader().use { it.readText() }
                              val parts = JSONObject(txt).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts")
                              val sb = StringBuilder()
                              for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text", ""))
                              val a = sb.toString().trim()
                              if (a.isEmpty()) throw AiErr("ИИ промолчал, сэр. Спросите иначе.")
                              return a
                          }
                          val err = try { con.errorStream?.bufferedReader()?.use { it.readText() } ?: "" } catch (e: Exception) { "" }
                          lastCode = code
                          lastBody = err
                          log("Gemini " + model + " код " + code + ": " + err.take(200))
                          if (code == 400 && attempt == 0 && !err.contains("API key") && !err.contains("FAILED_PRECONDITION")) continue
                          break
                      }
                      if (lastCode != 404) break
                  }
                  val msg = when {
                      lastBody.contains("API key not valid") || lastBody.contains("API_KEY_INVALID") -> "Ключ Gemini не подошёл, сэр. Проверьте его в настройках."
                      lastBody.contains("FAILED_PRECONDITION") -> "В вашей стране бесплатный доступ к Gemini недоступен, сэр."
                      lastCode == 429 -> "Бесплатный лимит Gemini на сейчас исчерпан, сэр. Попробуйте позже."
                      else -> "ИИ не ответил, сэр. Код " + lastCode + "."
                  }
                  throw AiErr(msg)
              }

              private fun callClaude(key: String, sys: String, hist: JSONArray, q: String): String {
                  val msgs = JSONArray()
                  for (i in 0 until hist.length()) msgs.put(hist.getJSONObject(i))
                  msgs.put(JSONObject().put("role", "user").put("content", q))
                  val body = JSONObject()
                      .put("model", "claude-haiku-5-5")
                      .put("max_tokens", 300)
                      .put("system", sys)
                      .put("messages", msgs)
                  val con = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                  con.requestMethod = "POST"
                  con.connectTimeout = 10000
                  con.readTimeout = 30000
                  con.doOutput = true
                  con.setRequestProperty("content-type", "application/json")
                  con.setRequestProperty("x-api-key", key)
                  con.setRequestProperty("anthropic-version", "2023-06-01")
                  con.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                  val code = con.responseCode
                  if (code == 200) {
                      val txt = con.inputStream.bufferedReader().use { it.readText() }
                      return JSONObject(txt).getJSONArray("content").getJSONObject(0).getString("text").trim()
                  }
                  val err = try { con.errorStream?.bufferedReader()?.use { it.readText() } ?: "" } catch (e: Exception) { "" }
                  log("Claude код " + code + ": " + err.take(200))
                  throw AiErr(if (code == 401) "Ключ ИИ не подошёл, сэр. Проверьте его в настройках." else "ИИ не ответил, сэр. Код " + code + ".")
              }

              private fun wiki(q: String) {
                  busy("Ищу", q)
                  Thread {
                      var out = ""
                      try {
                          val topic = q.replace(Regex("^(что такое|кто такой|кто такая|кто такие|расскажи про|расскажи о)\\s+"), "").trim()
                          val u = URL("https://ru.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&exintro=1&explaintext=1&exsentences=2&redirects=1&generator=search&gsrlimit=1&gsrsearch=" + Uri.encode(topic))
                          val con = u.openConnection() as HttpURLConnection
                          con.connectTimeout = 8000
                          con.readTimeout = 8000
                          con.setRequestProperty("User-Agent", "Jura/1.0")
                          val body = con.inputStream.bufferedReader().use { it.readText() }
                          val pages = JSONObject(body).getJSONObject("query").getJSONObject("pages")
                          val k = pages.keys().next()
                          out = pages.getJSONObject(k).optString("extract", "").trim()
                          if (out.isEmpty()) out = "Ничего не нашёл, сэр."
                      } catch (e: Exception) {
                          log("Вики: " + e)
                          out = "Ничего не нашёл, сэр."
                      }
                      val res = out.take(500)
                      h.post { speak(res) }
                  }.start()
              }

              private fun nums(c: String): List<Int> {
                  val out = ArrayList<Int>()
                  val ws = c.split(" ")
                  var i = 0
                  while (i < ws.size) {
                      val w = ws[i]
                      val d = w.toIntOrNull()
                      val v = d ?: numMap[w]
                      if (v != null) {
                          if (d == null && v >= 20 && i + 1 < ws.size) {
                              val nx = numMap[ws[i + 1]]
                              if (nx != null && nx in 1..9) {
                                  out.add(v + nx)
                                  i += 2
                                  continue
                              }
                          }
                          out.add(v)
                      }
                      i++
                  }
                  return out
              }

              private fun parseHm(c: String): Pair<Int, Int>? {
                  val ns = nums(c)
                  if (ns.isEmpty()) return null
                  var hh = ns[0]
                  var mm = 0
                  if (ns.size >= 3 && ns[1] == 0) {
                      mm = ns[2]
                  } else if (ns.size >= 2) {
                      mm = ns[1]
                  }
                  if ((c.contains("вечера") || c.contains("дня")) && hh < 12) hh += 12
                  if (c.contains("ночи") && hh == 12) hh = 0
                  if (hh !in 0..23 || mm !in 0..59) return null
                  return Pair(hh, mm)
              }

              private fun pctWord(n: Int): String {
                  val a = Math.abs(n)
                  return if (a % 10 == 1 && a % 100 != 11) "процент"
                  else if (a % 10 in 2..4 && a % 100 !in 12..14) "процента"
                  else "процентов"
              }

              private fun sysCmd(c: String): Boolean {
                  when {
                      c.contains("разбуди") || (c.contains("умн") && c.contains("будильник")) -> wakeCmd(c)
                      c.contains("фонар") -> torch(!(c.contains("выключ") || c.contains("погас") || c.contains("отключ")))
                      c.contains("будильник") -> setAlarm(c)
                      c.contains("таймер") -> setTimer(c)
                      c.contains("заряд") || c.contains("батаре") -> battery()
                      c.contains("вайфай") || c.contains("вай фай") || c.contains("wifi") -> openSys(Settings.ACTION_WIFI_SETTINGS, "вайфай")
                      c.contains("блютуз") || c.contains("блютус") || c.contains("bluetooth") -> openSys(Settings.ACTION_BLUETOOTH_SETTINGS, "блютуз")
                      else -> return false
                  }
                  return true
              }

              private fun wakeCmd(c: String) {
                  if (c.contains("отмени") || c.contains("выключ") || c.contains("удали") || c.contains("отключ")) {
                      Wake.cancel(this)
                      speak("Умный будильник отменён, сэр.")
                      return
                  }
                  val now = System.currentTimeMillis()
                  var at = 0L
                  if (c.contains("через")) {
                      val ns = nums(c)
                      val secs = if (c.contains("полчаса")) {
                          1800
                      } else {
                          val n = if (ns.isEmpty()) 1 else ns[0]
                          n * (if (c.contains("секунд")) 1 else if (c.contains("час")) 3600 else 60)
                      }
                      if (secs !in 1..86400) {
                          speak("Не понял, через сколько вас разбудить, сэр.", false)
                          return
                      }
                      at = now + secs * 1000L
                  } else {
                      val hm = parseHm(c)
                      if (hm == null) {
                          speak("На какое время разбудить, сэр? Скажите, например: разбуди меня в семь тридцать.", false)
                          return
                      }
                      val cal = Calendar.getInstance()
                      cal.set(Calendar.HOUR_OF_DAY, hm.first)
                      cal.set(Calendar.MINUTE, hm.second)
                      cal.set(Calendar.SECOND, 0)
                      cal.set(Calendar.MILLISECOND, 0)
                      if (cal.timeInMillis <= now) cal.add(Calendar.DAY_OF_YEAR, 1)
                      at = cal.timeInMillis
                  }
                  try {
                      Wake.schedule(this, at)
                      val cal2 = Calendar.getInstance()
                      cal2.timeInMillis = at
                      speak("Умный будильник на " + cal2.get(Calendar.HOUR_OF_DAY) + " " + "%02d".format(cal2.get(Calendar.MINUTE)) + " поставлен, сэр. Я разбужу вас голосом, погодой и музыкой.")
                  } catch (e: Exception) {
                      log("Умный будильник: " + e)
                      speak("Не удалось поставить умный будильник, сэр.")
                  }
              }

              private fun openSys(action: String, name: String) {
                  speak("Открываю настройки " + name + ", сэр. Включить его без вас Android не позволяет.")
                  h.postDelayed({
                      try {
                          val i = Intent(action)
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(i)
                      } catch (e: Exception) { log("Настройки: " + e) }
                  }, 2500)
              }

              private fun torch(on: Boolean) {
                  try {
                      val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      var id: String? = null
                      for (x in cm.cameraIdList) {
                          val ch = cm.getCameraCharacteristics(x)
                          if (ch.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true) {
                              id = x
                              break
                          }
                      }
                      if (id == null) {
                          speak("Фонарика на этом телефоне нет, сэр.")
                          return
                      }
                      cm.setTorchMode(id, on)
                      speak(if (on) "Фонарик включён, сэр." else "Фонарик выключен, сэр.", false)
                  } catch (e: Exception) {
                      log("Фонарик: " + e)
                      speak("Не удалось управлять фонариком, сэр.")
                  }
              }

              private fun battery() {
                  try {
                      val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                      val lvl = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                      speak("Заряд батареи " + lvl + " " + pctWord(lvl) + ", сэр.")
                  } catch (e: Exception) {
                      log("Батарея: " + e)
                      speak("Не удалось узнать заряд, сэр.")
                  }
              }

              private fun setAlarm(c: String) {
                  if (c.contains("отмени") || c.contains("выключ") || c.contains("удали") || c.contains("отключ")) {
                      speak("Отключить будильник можно только в приложении Часы, сэр.")
                      return
                  }
                  val hm = parseHm(c)
                  if (hm == null) {
                      speak("На какое время поставить будильник, сэр? Скажите, например: поставь будильник на семь тридцать.", false)
                      return
                  }
                  val hh = hm.first
                  val mm = hm.second
                  try {
                      val i = Intent(AlarmClock.ACTION_SET_ALARM)
                      i.putExtra(AlarmClock.EXTRA_HOUR, hh)
                      i.putExtra(AlarmClock.EXTRA_MINUTES, mm)
                      i.putExtra(AlarmClock.EXTRA_MESSAGE, "JURA")
                      i.putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                      speak("Будильник на " + hh + " " + "%02d".format(mm) + " поставлен, сэр.")
                  } catch (e: Exception) {
                      log("Будильник: " + e)
                      speak("Не удалось поставить будильник, сэр.")
                  }
              }

