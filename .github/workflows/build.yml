          package com.jura.assistant

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          object NotifStore {
              class Item(val pkg: String, val who: String, val text: String)

              val whatsapp = listOf("com.whatsapp", "com.whatsapp.w4b")
              val instagram = listOf("com.instagram.android")
              val telegram = listOf("org.telegram.messenger", "org.telegram.messenger.web")
              val watched = whatsapp + instagram + telegram

              private val items = ArrayList<Item>()

              @Synchronized
              fun add(i: Item) {
                  items.removeAll { it.pkg == i.pkg && it.who == i.who && it.text == i.text }
                  items.add(i)
                  while (items.size > 30) items.removeAt(0)
              }

              @Synchronized
              fun recent(pk: List<String>, n: Int): List<Item> {
                  return items.filter { pk.contains(it.pkg) }.takeLast(n).reversed()
              }
          }

          class JuraNotifService : NotificationListenerService() {
              override fun onListenerConnected() {
                  try {
                      val arr = activeNotifications
                      if (arr != null) {
                          for (s in arr) take(s)
                      }
                  } catch (e: Exception) {}
