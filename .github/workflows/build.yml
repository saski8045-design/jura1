name: Build Jura
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/jura/assistant app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Jura'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.jura.assistant'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.jura.assistant'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'com.alphacephei:vosk-android:0.3.47'
              implementation 'net.java.dev.jna:jna:5.13.0@aar'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>
              <application android:label="JURA" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".JuraService" android:exported="false" android:foregroundServiceType="microphone"/>
                  <service android:name=".JuraNotifService" android:exported="true" android:label="JURA" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#040904" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0A1F0A" android:pathData="M54,54m-34,0a34,34 0 1,0 68,0a34,34 0 1,0 -68,0"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:strokeColor="#39FF14" android:strokeWidth="2.5" android:fillColor="#00000000"
                  android:pathData="M54,54m-26,0a26,26 0 1,0 52,0a26,26 0 1,0 -52,0"/>
              <path android:strokeColor="#39FF14" android:strokeWidth="3.5" android:strokeLineCap="round"
                  android:pathData="M42,50L42,58M48,45L48,63M54,40L54,68M60,45L60,63M66,50L66,58"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_logo.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#040904" android:pathData="M54,54m-50,0a50,50 0 1,0 100,0a50,50 0 1,0 -100,0"/>
              <path android:fillColor="#0A1F0A" android:pathData="M54,54m-38,0a38,38 0 1,0 76,0a38,38 0 1,0 -76,0"/>
              <path android:strokeColor="#39FF14" android:strokeWidth="2.5" android:fillColor="#00000000"
                  android:pathData="M54,54m-28,0a28,28 0 1,0 56,0a28,28 0 1,0 -56,0"/>
              <path android:strokeColor="#39FF14" android:strokeWidth="3.5" android:strokeLineCap="round"
                  android:pathData="M42,50L42,58M48,45L48,63M54,40L54,68M60,45L60,63M66,50L66,58"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_notif.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:strokeColor="#FFFFFF" android:strokeWidth="2" android:strokeLineCap="round"
                  android:pathData="M4,10L4,14M8,7L8,17M12,4L12,20M16,7L16,17M20,10L20,14"/>
          </vector>
          EOF
          cat > app/src/main/java/com/jura/assistant/MainActivity.kt <<'EOF'
          package com.jura.assistant

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var logView: TextView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val sv = ScrollView(this)
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.VERTICAL
                  l.setPadding(48, 96, 48, 48)
                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_logo)
                  val lp = LinearLayout.LayoutParams(360, 360)
                  lp.gravity = Gravity.CENTER_HORIZONTAL
                  l.addView(logo, lp)
                  val title = TextView(this)
                  title.text = "JURA"
                  title.textSize = 28f
                  title.gravity = Gravity.CENTER_HORIZONTAL
                  l.addView(title)
                  val hint = TextView(this)
                  hint.text = "Нажмите кнопки по порядку. Потом скажите: который час, позвони маме, открой ютуб, кто мне написал в ватсап, смени голос."
                  l.addView(hint)
                  fun btn(t: String, a: () -> Unit) {
                      val x = Button(this)
                      x.text = t
                      x.setOnClickListener { a() }
                      l.addView(x)
                  }
                  btn("1. Дать разрешения") { askPerms() }
                  btn("2. Разрешить поверх других окон") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                  }
                  btn("3. Снять ограничения батареи") {
                      startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                  }
                  btn("4. Запустить Джуру") { startJura() }
                  btn("5. Доступ к уведомлениям") {
                      startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"))
                  }
                  btn("Остановить") { stopService(Intent(this, JuraService::class.java)) }
                  btn("Обновить журнал") { showLog() }
                  btn("Очистить журнал") {
                      getSharedPreferences("jura", MODE_PRIVATE).edit().remove("log").apply()
                      showLog()
                  }
                  logView = TextView(this)
                  logView.textSize = 12f
                  logView.setTextIsSelectable(true)
                  l.addView(logView)
                  sv.addView(l)
                  setContentView(sv)
                  askPerms()
                  showLog()
              }

              override fun onResume() {
                  super.onResume()
                  showLog()
              }

              private fun showLog() {
                  logView.text = getSharedPreferences("jura", MODE_PRIVATE).getString("log", "Журнал пуст")
              }

              private fun startJura() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Сначала нажмите 1 и разрешите микрофон", Toast.LENGTH_LONG).show()
                      askPerms()
                      return
                  }
                  startForegroundService(Intent(this, JuraService::class.java))
              }

              private fun askPerms() {
                  requestPermissions(arrayOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.POST_NOTIFICATIONS), 1)
              }
          }
          EOF
          cat > app/src/main/java/com/jura/assistant/JuraNotif.kt <<'EOF'
          package com.jura.assistant

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          object NotifStore {
              class Item(val pkg: String, val who: String, val text: String)

              val whatsapp = listOf("com.whatsapp", "com.whatsapp.w4b")
              val instagram = listOf("com.instagram.android")
              val telegram = listOf("org.telegram.messenger", "org.telegram.messenger.web")
              val watched = whatsapp + instagram + telegram

              private val items = ArrayList<Item>()

              @Synchronized
              fun add(i: Item) {
                  items.removeAll { it.pkg == i.pkg && it.who == i.who && it.text == i.text }
                  items.add(i)
                  while (items.size > 30) items.removeAt(0)
              }

              @Synchronized
              fun recent(pk: List<String>, n: Int): List<Item> {
                  return items.filter { pk.contains(it.pkg) }.takeLast(n).reversed()
              }
          }

          class JuraNotifService : NotificationListenerService() {
              override fun onListenerConnected() {
                  try {
                      val arr = activeNotifications
                      if (arr != null) {
                          for (s in arr) take(s)
                      }
                  } catch (e: Exception) {}
                  JuraService.writeLog(this, "Доступ к уведомлениям работает")
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn != null) take(sbn)
              }

              private fun take(sbn: StatusBarNotification) {
                  try {
                      if (!NotifStore.watched.contains(sbn.packageName)) return
                      val n = sbn.notification ?: return
                      if ((n.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return
                      val ex = n.extras ?: return
                      val who = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                      val text = ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                      if (text.isBlank()) return
                      NotifStore.add(NotifStore.Item(sbn.packageName, who, text))
                  } catch (e: Exception) {}
              }
          }
          EOF
          cat > app/src/main/java/com/jura/assistant/JuraService.kt <<'EOF'
          package com.jura.assistant

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.ContactsContract
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.speech.tts.Voice
          import android.telecom.TelecomManager
          import android.util.Log
          import org.json.JSONObject
          import org.vosk.Model
          import org.vosk.Recognizer
          import org.vosk.android.RecognitionListener
          import org.vosk.android.SpeechService
          import org.vosk.android.StorageService
          import java.io.IOException
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          class JuraService : Service(), TextToSpeech.OnInitListener {
              companion object {
                  fun writeLog(c: Context, m: String) {
                      Log.d("Jura", m)
                      try {
                          val p = c.getSharedPreferences("jura", Context.MODE_PRIVATE)
                          val t = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
                          val old = p.getString("log", "") ?: ""
                          val lines = (old + "\n" + t + " " + m).trim().split("\n").takeLast(40)
                          p.edit().putString("log", lines.joinToString("\n")).apply()
                      } catch (e: Exception) {}
                  }
              }

              private var tts: TextToSpeech? = null
              private var ttsOk = false
              private var model: Model? = null
              private var svc: SpeechService? = null
              private val h = Handler(Looper.getMainLooper())
              private var awaiting = false
              private var running = true
              private var speaking = false
              private var speakId = 0
              private var errCount = 0
              private var wl: PowerManager.WakeLock? = null
              private val ru = Locale("ru", "RU")

              private fun log(m: String) { writeLog(this, m) }

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int = START_NOT_STICKY

              override fun onCreate() {
                  super.onCreate()
                  log("Служба создана, Android " + Build.VERSION.SDK_INT)
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("jura", "JURA", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "jura")
                      .setContentTitle("JURA слушает")
                      .setSmallIcon(R.drawable.ic_notif)
                      .setOngoing(true)
                      .build()
                  val hasMic = checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  log("Разрешение микрофона: " + hasMic)
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                      } else {
                          startForeground(1, n)
                      }
                  } catch (e: Exception) {
                      log("startForeground не удался: " + e)
                      running = false
                      stopSelf()
                      return
                  }
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "jura:wl")
                      wl?.acquire()
                  } catch (e: Exception) { log("WakeLock: " + e) }
                  tts = TextToSpeech(this, this)
              }

              override fun onInit(s: Int) {
                  val t = tts
                  if (t != null && s == TextToSpeech.SUCCESS) {
                      ttsOk = true
                      val r = t.setLanguage(ru)
                      log("TTS русский язык, код " + r + ", модуль " + t.defaultEngine)
                      applyVoice()
                      log("Русских голосов: " + ruVoices().size)
                      t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                          override fun onStart(u: String?) {}
                          override fun onError(u: String?) { done() }
                          override fun onDone(u: String?) { done() }
                      })
                  } else {
                      log("TTS не запустился, код " + s)
                  }
                  loadModel()
              }

              private fun ruVoices(): List<Voice> {
                  val t = tts ?: return emptyList()
                  return try {
                      val all = t.getVoices() ?: emptySet<Voice>()
                      all.filter {
                          it.locale.language == "ru" &&
                              !it.features.contains(TextToSpeech.Engine.KEY_FEATURE_NOT_INSTALLED)
                      }.sortedBy { it.name }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun applyVoice() {
                  val t = tts ?: return
                  val p = getSharedPreferences("jura", MODE_PRIVATE)
                  val vn = p.getString("voice", null)
                  if (vn != null) {
                      try {
                          val v = ruVoices().firstOrNull { it.name == vn }
                          if (v != null) t.setVoice(v)
                      } catch (e: Exception) { log("Голос: " + e) }
                  }
                  t.setPitch(p.getFloat("pitch", 0.6f))
                  t.setSpeechRate(p.getFloat("rate", 0.95f))
              }

              private fun changeVoice() {
                  val t = tts ?: return
                  val list = ruVoices()
                  if (list.isEmpty()) {
                      speak("Русских голосов на телефоне не нашёл, сэр.")
                      return
                  }
                  if (list.size == 1) {
                      speak("На телефоне только один русский голос, сэр. Другие можно скачать в настройках речи Google.")
                      return
                  }
                  val cur = try { t.getVoice()?.name } catch (e: Exception) { null }
                  val idx = list.indexOfFirst { it.name == cur }
                  val next = list[(idx + 1) % list.size]
                  try { t.setVoice(next) } catch (e: Exception) { log("Смена голоса: " + e) }
                  getSharedPreferences("jura", MODE_PRIVATE).edit().putString("voice", next.name).apply()
                  val num = list.indexOf(next) + 1
                  log("Голос: " + next.name + ", " + num + " из " + list.size)
                  speak("Теперь я говорю так, сэр. Голос " + num + " из " + list.size + ".")
              }

              private fun tune(dp: Float, dr: Float, phrase: String) {
                  val p = getSharedPreferences("jura", MODE_PRIVATE)
                  val pitch = (p.getFloat("pitch", 0.6f) + dp).coerceIn(0.3f, 1.5f)
                  val rate = (p.getFloat("rate", 0.95f) + dr).coerceIn(0.5f, 1.6f)
                  p.edit().putFloat("pitch", pitch).putFloat("rate", rate).apply()
                  tts?.setPitch(pitch)
                  tts?.setSpeechRate(rate)
                  log("Высота " + pitch + ", скорость " + rate)
                  speak(phrase)
              }

              private fun loadModel() {
                  log("Загружаю модель распознавания, подождите...")
                  StorageService.unpack(this, "model-ru", "model",
                      { m: Model ->
                          model = m
                          log("Модель загружена")
                          h.post {
                              if (running) {
                                  if (ttsOk) speak("Джура к вашим услугам, сэр.") else startRec()
                              }
                          }
                      },
                      { e: IOException ->
                          log("Не удалось загрузить модель: " + e)
                          running = false
                          h.post {
                              if (ttsOk) speak("Не удалось загрузить модель распознавания, сэр.") else stopSelf()
                          }
                      })
              }

              private fun done() {
                  h.post {
                      speaking = false
                      if (!running) stopSelf() else startRec()
                  }
              }

              private fun speak(s: String) {
                  log("Говорю: " + s)
                  speakId++
                  val my = speakId
                  speaking = true
                  try { svc?.setPause(true) } catch (e: Exception) {}
                  if (tts == null || !ttsOk) {
                      speaking = false
                      if (!running) stopSelf() else startRec()
                      return
                  }
                  tts?.speak(s, TextToSpeech.QUEUE_FLUSH, null, "u")
                  h.postDelayed({
                      if (speaking && speakId == my) {
                          log("Синтезатор не ответил, продолжаю")
                          done()
                      }
                  }, 30000)
              }

              private val listener = object : RecognitionListener {
                  override fun onPartialResult(hypothesis: String?) {}
                  override fun onResult(hypothesis: String?) { onText(hypothesis) }
                  override fun onFinalResult(hypothesis: String?) {}
                  override fun onError(exception: Exception?) {
                      log("Ошибка распознавания: " + exception)
                      errCount++
                      try { svc?.shutdown() } catch (e: Exception) {}
                      svc = null
                      if (errCount > 3) {
                          running = false
                          speak("Не удаётся запустить распознавание речи, сэр. Подробности в журнале.")
                      } else {
                          h.postDelayed({ if (running && !speaking) startRec() }, 1000)
                      }
                  }
                  override fun onTimeout() {}
              }

              private fun startRec() {
                  val m = model ?: return
                  if (!running) return
                  val cur = svc
                  if (cur != null) {
                      try { cur.setPause(false) } catch (e: Exception) { log("Пауза: " + e) }
                      return
                  }
                  try {
                      val r = Recognizer(m, 16000.0f)
                      val s = SpeechService(r, 16000.0f)
                      svc = s
                      s.startListening(listener)
                      log("Слушаю")
                  } catch (e: Exception) {
                      log("Запуск распознавания: " + e)
                      svc = null
                      running = false
                      speak("Не удаётся запустить распознавание речи, сэр.")
                  }
              }

              private fun onText(hyp: String?) {
                  if (speaking || hyp == null) return
                  val text = try { JSONObject(hyp).optString("text", "") } catch (e: Exception) { "" }
                  if (text.isBlank()) return
                  errCount = 0
                  log("Услышал: " + text)
                  handle(text)
              }

              private fun handle(raw: String) {
                  val t = raw.lowercase(ru).trim()
                  var cmd = t
                  var named = awaiting
                  if (!awaiting) {
                      val keys = listOf("джур", "жур", "дюр", "юра", "дур", "жор")
                      var idx = -1
                      var len = 0
                      for (k in keys) {
                          val p = t.indexOf(k)
                          if (p >= 0 && (idx < 0 || p < idx)) { idx = p; len = k.length }
                      }
                      if (idx >= 0) {
                          named = true
                          cmd = t.substring(idx + len)
                          if (cmd.isNotEmpty() && "аеуыи".indexOf(cmd[0]) >= 0 && (cmd.length == 1 || !cmd[1].isLetter())) {
                              cmd = cmd.substring(1)
                          }
                      }
                  }
                  cmd = cmd.trim(' ', ',', '.', '!')
                  if (named && cmd.isEmpty()) {
                      awaiting = true
                      speak("Слушаю, сэр.")
                      return
                  }
                  awaiting = false
                  if (cmd.isEmpty()) return
                  if (!exec(cmd) && named) {
                      speak("Простите, сэр, я не понял команду. Я услышал: " + cmd + ".")
                  }
              }

              private fun exec(c: String): Boolean {
                  val call = Regex("^(позвони|набери|звони|позвонить)\\s+(.+)$").find(c)
                  val open = Regex("^(открой|открыть|запусти|зайди в|зайди|включи)\\s+(в\\s+)?(.+)$").find(c)
                  when {
                      call != null -> callContact(call.groupValues[2])
                      open != null -> openApp(open.groupValues[3])
                      c.contains("голос") && (c.contains("смени") || c.contains("поменя") || c.contains("друго")) -> changeVoice()
                      c.contains("ниже") && (c.contains("говори") || c.contains("голос")) -> tune(-0.15f, 0f, "Говорю ниже, сэр.")
                      c.contains("выше") && (c.contains("говори") || c.contains("голос")) -> tune(0.15f, 0f, "Говорю выше, сэр.")
                      c.contains("быстрее") && c.contains("говори") -> tune(0f, 0.15f, "Говорю быстрее, сэр.")
                      c.contains("медленнее") && c.contains("говори") -> tune(0f, -0.15f, "Говорю медленнее, сэр.")
                      c.contains("написал") || c.contains("сообщени") || c.contains("уведомлен") || c.startsWith("прочитай") -> readNotifs(c)
                      c.contains("умеешь") -> speak("Я умею говорить время и дату, звонить контактам, открывать приложения, читать сообщения из мессенджеров и менять голос, сэр.")
                      c.contains("врем") -> {
                          val cal = Calendar.getInstance()
                          speak("Сейчас " + cal.get(Calendar.HOUR_OF_DAY) + " " + "%02d".format(cal.get(Calendar.MINUTE)) + ", сэр.")
                      }
                      c.contains("дата") || c.contains("число") || c.contains("день") -> {
                          speak("Сегодня " + SimpleDateFormat("EEEE, d MMMM yyyy", ru).format(Date()) + ", сэр.")
                      }
                      else -> return false
                  }
                  return true
              }

              private fun readNotifs(c: String) {
                  val enabled = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                  if (!enabled.contains(packageName)) {
                      speak("Нет доступа к уведомлениям, сэр. Откройте приложение и нажмите кнопку пять.")
                      return
                  }
                  var pk = NotifStore.watched
                  var name = "мессенджерах"
                  when {
                      c.contains("ватсап") || c.contains("вацап") || c.contains("whatsapp") -> { pk = NotifStore.whatsapp; name = "WhatsApp" }
                      c.contains("инст") -> { pk = NotifStore.instagram; name = "Instagram" }
                      c.contains("телег") -> { pk = NotifStore.telegram; name = "Telegram" }
                  }
                  val list = NotifStore.recent(pk, 5)
                  if (list.isEmpty()) {
                      speak("В " + name + " новых сообщений нет, сэр.")
                      return
                  }
                  val sb = StringBuilder("В " + name + ": ")
                  for (m in list) {
                      sb.append(m.who).append(": ").append(m.text.take(150)).append(". ")
                  }
                  speak(sb.toString())
              }

              private fun callContact(q: String) {
                  val qs = q.split(" ").filter { it.length > 1 }
                  var best: String? = null
                  var bestName = ""
                  var bestScore = 0
                  try {
                      val cur = contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER),
                          null, null, null)
                      if (cur != null) {
                          while (cur.moveToNext()) {
                              val name = cur.getString(0) ?: continue
                              val words = name.lowercase(ru).split(" ")
                              var score = 0
                              var ok = qs.isNotEmpty()
                              for (w in qs) {
                                  var m = 0
                                  for (x in words) {
                                      var k = 0
                                      while (k < w.length && k < x.length && w[k] == x[k]) k++
                                      if (k > m) m = k
                                  }
                                  if (m >= minOf(3, w.length)) score += m else ok = false
                              }
                              if (ok && score > bestScore) {
                                  bestScore = score
                                  best = cur.getString(1)
                                  bestName = name
                              }
                          }
                          cur.close()
                      }
                  } catch (e: Exception) { log("Контакты: " + e) }
                  val num = best
                  if (num == null) {
                      speak("Не нашёл контакт " + q + ", сэр.")
                      return
                  }
                  speak("Звоню, " + bestName + ", сэр.")
                  h.postDelayed({
                      try {
                          getSystemService(TelecomManager::class.java).placeCall(Uri.fromParts("tel", num, null), Bundle())
                      } catch (e: Exception) {
                          log("Звонок: " + e)
                          speak("Не удалось позвонить, сэр.")
                      }
                  }, 1800)
              }

              private fun openApp(q0: String) {
                  val raw = q0.trim()
                  val alias = listOf(
                      "ютуб" to "youtube", "ютьюб" to "youtube",
                      "ватсап" to "whatsapp", "вацап" to "whatsapp",
                      "телеграм" to "telegram", "хром" to "chrome",
                      "гугл" to "google", "плей маркет" to "play",
                      "инста" to "instagram",
                      "чат" to "chatgpt",
                      "клод" to "claude", "клауд" to "claude",
                      "легенд" to "mobile legends", "мобайл" to "mobile legends",
                      "дота" to "dota")
                  var q = raw
                  for (a in alias) {
                      if (raw.contains(a.first)) { q = a.second; break }
                  }
                  val pkgs = mapOf(
                      "instagram" to "com.instagram.android",
                      "chatgpt" to "com.openai.chatgpt",
                      "claude" to "com.anthropic.claude",
                      "mobile legends" to "com.mobile.legends",
                      "whatsapp" to "com.whatsapp",
                      "telegram" to "org.telegram.messenger",
                      "youtube" to "com.google.android.youtube")
                  val pm = packageManager
                  val list = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                  var pkg: String? = null
                  for (r in list) {
                      val label = r.loadLabel(pm).toString().lowercase(ru)
                      if (label.contains(q) || (q.length > 3 && q.contains(label))) {
                          pkg = r.activityInfo.packageName
                          break
                      }
                  }
                  var li = if (pkg != null) pm.getLaunchIntentForPackage(pkg) else null
                  if (li == null) {
                      val fb = pkgs[q]
                      if (fb != null) li = pm.getLaunchIntentForPackage(fb)
                  }
                  val go = li
                  if (go == null) {
                      speak("Не нашёл приложение " + q0 + ", сэр.")
                      return
                  }
                  speak("Открываю, сэр.")
                  h.postDelayed({
                      go.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      try { startActivity(go) } catch (e: Exception) { log("Запуск: " + e) }
                  }, 1300)
              }

              override fun onDestroy() {
                  log("Служба остановлена")
                  running = false
                  h.removeCallbacksAndMessages(null)
                  try { svc?.stop() } catch (e: Exception) {}
                  try { svc?.shutdown() } catch (e: Exception) {}
                  try { model?.close() } catch (e: Exception) {}
                  tts?.shutdown()
                  try { if (wl?.isHeld == true) wl?.release() } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          EOF
      - name: Download speech model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip
          mv vosk-model-small-ru-0.22 app/src/main/assets/model-ru
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/model-ru/uuid
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --title "Jura v${{ github.run_number }}" --notes "Jura APK"
