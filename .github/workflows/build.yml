                  val arr = JSONArray()
                  val start = if (old.length() > 10) old.length() - 10 else 0
                  for (i in start until old.length()) arr.put(old.getJSONObject(i))
                  arr.put(JSONObject().put("role", "user").put("content", q))
                  arr.put(JSONObject().put("role", "assistant").put("content", a))
                  prefs().edit().putString("history", arr.toString()).apply()
              }

