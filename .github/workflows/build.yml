          cat > app/src/main/java/com/jura/assistant/Wx.kt <<'EOF'
          package com.jura.assistant

          import android.content.Context
          import android.net.Uri
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class AiErr(m: String) : Exception(m)

          object Wx {
              private fun tempWord(t: Int): String {
                  val a = Math.abs(t)
                  val w = if (a % 10 == 1 && a % 100 != 11) "градус"
                  else if (a % 10 in 2..4 && a % 100 !in 12..14) "градуса"
                  else "градусов"
                  return (if (t < 0) "минус " else "") + a + " " + w
              }

              private fun codeWord(c: Int): String {
                  return when {
                      c == 0 -> "ясно"
                      c in 1..2 -> "переменная облачность"
                      c == 3 -> "пасмурно"
                      c == 45 || c == 48 -> "туман"
                      c in 51..57 -> "морось"
                      c in 61..67 -> "дождь"
                      c in 71..77 -> "снег"
                      c in 80..82 -> "ливень"
                      c in 85..86 -> "снегопад"
                      c >= 95 -> "гроза"
                      else -> "без осадков"
                  }
              }

              fun who(c: Context): String {
                  val n = c.getSharedPreferences("jura", Context.MODE_PRIVATE).getString("user_name", "") ?: ""
                  return n.ifBlank { "сэр" }
              }

              fun text(c: Context): String {
                  val p = c.getSharedPreferences("jura", Context.MODE_PRIVATE)
                  val city = p.getString("city", "Душанбе") ?: "Душанбе"
                  return try {
                      var lat = 38.5598
                      var lon = 68.7870
                      if (city != "Душанбе") {
                          if (p.getString("geo_city", "") == city) {
                              lat = (p.getString("lat", "0") ?: "0").toDouble()
                              lon = (p.getString("lon", "0") ?: "0").toDouble()
                          } else {
                              val g = URL("https://geocoding-api.open-meteo.com/v1/search?count=1&language=ru&format=json&name=" + Uri.encode(city))
                              val gc = g.openConnection() as HttpURLConnection
                              gc.connectTimeout = 6000
                              gc.readTimeout = 6000
                              val gb = gc.inputStream.bufferedReader().use { it.readText() }
                              val res = JSONObject(gb).optJSONArray("results")
                              if (res == null || res.length() == 0) throw Exception("город не найден")
                              val r0 = res.getJSONObject(0)
                              lat = r0.getDouble("latitude")
                              lon = r0.getDouble("longitude")
                              p.edit().putString("geo_city", city).putString("lat", lat.toString()).putString("lon", lon.toString()).apply()
                          }
                      }
                      val u = URL("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,weather_code&timezone=auto")
                      val con = u.openConnection() as HttpURLConnection
                      con.connectTimeout = 6000
                      con.readTimeout = 6000
                      val body = con.inputStream.bufferedReader().use { it.readText() }
                      val cur = JSONObject(body).getJSONObject("current")
                      val t = Math.round(cur.getDouble("temperature_2m")).toInt()
                      val code = cur.getInt("weather_code")
                      "Город " + city + ": " + tempWord(t) + ", " + codeWord(code) + "."
                  } catch (e: Exception) {
                      JuraService.writeLog(c, "Погода: " + e)
                      "Не удалось узнать погоду."
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/jura/assistant/Wake.kt <<'EOF'
          package com.jura.assistant

          import android.Manifest
          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.MediaStore
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.speech.tts.Voice
          import java.util.Calendar
          import java.util.Locale

          object Wake {
              private fun op(c: Context): PendingIntent {
                  return PendingIntent.getBroadcast(c, 77, Intent(c, WakeReceiver::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }

              fun schedule(c: Context, at: Long) {
                  val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val show = PendingIntent.getActivity(c, 78, Intent(c, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  am.setAlarmClock(AlarmManager.AlarmClockInfo(at, show), op(c))
                  c.getSharedPreferences("jura", Context.MODE_PRIVATE).edit().putLong("wake_at", at).apply()
              }

              fun cancel(c: Context) {
                  val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  am.cancel(op(c))
                  c.getSharedPreferences("jura", Context.MODE_PRIVATE).edit().remove("wake_at").apply()
              }
          }

          class WakeReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val p = c.getSharedPreferences("jura", Context.MODE_PRIVATE)
                  if (i.action == Intent.ACTION_BOOT_COMPLETED) {
                      val at = p.getLong("wake_at", 0L)
                      if (at > System.currentTimeMillis()) Wake.schedule(c, at)
                      return
                  }
                  p.edit().remove("wake_at").apply()
                  try {
                      c.startForegroundService(Intent(c, WakeService::class.java))
                  } catch (e: Exception) {
                      JuraService.writeLog(c, "Будильник не запустился: " + e)
                  }
              }
          }

          class WakeService : Service(), TextToSpeech.OnInitListener {
              companion object {
                  @Volatile
                  var alive = false
              }

              private val h = Handler(Looper.getMainLooper())
              private var tts: TextToSpeech? = null
              private var mp: MediaPlayer? = null
              private var wl: PowerManager.WakeLock? = null
              private var greeting = ""
              private var talking = false
              private var stopped = false
              private var tracks: List<Uri> = emptyList()
              private var idx = 0
              private var fails = 0

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val a = i?.action
                  if (a == "stop") {
                      finish()
                  } else if (a == "snooze") {
                      Wake.schedule(this, System.currentTimeMillis() + 5 * 60 * 1000L)
                      finish()
                  }
                  return START_NOT_STICKY
              }

              @Suppress("DEPRECATION")
              override fun onCreate() {
                  super.onCreate()
                  alive = true
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("wake", "Будильник JURA", NotificationManager.IMPORTANCE_HIGH))
                  val fl = PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  val stopPi = PendingIntent.getService(this, 1, Intent(this, WakeService::class.java).setAction("stop"), fl)
                  val snoozePi = PendingIntent.getService(this, 2, Intent(this, WakeService::class.java).setAction("snooze"), fl)
                  val openPi = PendingIntent.getActivity(this, 3, Intent(this, MainActivity::class.java), fl)
                  val n = Notification.Builder(this, "wake")
                      .setContentTitle("JURA: пора вставать")
                      .setContentText("Нажмите «Стоп», чтобы выключить")
                      .setSmallIcon(R.drawable.ic_notif)
                      .setOngoing(true)
                      .setCategory(Notification.CATEGORY_ALARM)
                      .setContentIntent(openPi)
                      .addAction(R.drawable.ic_notif, "Стоп", stopPi)
                      .addAction(R.drawable.ic_notif, "Ещё 5 минут", snoozePi)
                      .build()
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(2, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                      } else {
                          startForeground(2, n)
                      }
                  } catch (e: Exception) {
                      JuraService.writeLog(this, "Будильник: foreground не удался: " + e)
                      alive = false
                      stopSelf()
                      return
                  }
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "jura:wake")
                      wl?.acquire(12 * 60 * 1000L)
                  } catch (e: Exception) {}
                  loadTracks()
                  playNext()
                  h.postDelayed({ finish() }, 10 * 60 * 1000L)
                  Thread {
                      val cal = Calendar.getInstance()
                      val hh = cal.get(Calendar.HOUR_OF_DAY)
                      val mm = cal.get(Calendar.MINUTE)
                      val g = "Доброе утро, " + Wx.who(this) + ". Сейчас " + hh + " " + "%02d".format(mm) + ". " + Wx.text(this)
                      h.post {
                          greeting = g
                          if (!stopped) tts = TextToSpeech(this, this)
                      }
                  }.start()
              }

              override fun onInit(s: Int) {
                  val t = tts ?: return
                  if (stopped || s != TextToSpeech.SUCCESS) return
                  t.setLanguage(Locale("ru", "RU"))
                  t.setAudioAttributes(AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_ALARM)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                      .build())
                  val p = getSharedPreferences("jura", MODE_PRIVATE)
                  val pi = p.getInt("profile", 0).coerceIn(0, Prof.names.size - 1)
                  try {
                      val all = t.getVoices() ?: emptySet<Voice>()
                      val vs = all.filter {
                          it.locale.language == "ru" &&
                              !it.features.contains(TextToSpeech.Engine.KEY_FEATURE_NOT_INSTALLED)
                      }.sortedBy { it.name }
                      if (vs.isNotEmpty()) t.setVoice(vs[pi % vs.size])
                  } catch (e: Exception) {}
                  t.setPitch(p.getFloat("pitch", Prof.pitch[pi]))
                  t.setSpeechRate(p.getFloat("rate", Prof.rate[pi]))
                  t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(u: String?) { h.post { talking = true; vol(0.2f) } }
                      override fun onError(u: String?) { h.post { talking = false; vol(1.0f) } }
                      override fun onDone(u: String?) { h.post { talking = false; vol(1.0f) } }
                  })
                  t.speak(greeting, TextToSpeech.QUEUE_FLUSH, null, "w")
              }

              private fun vol(v: Float) {
                  try { mp?.setVolume(v, v) } catch (e: Exception) {}
              }

              private fun loadTracks() {
                  val list = ArrayList<Uri>()
                  try {
                      val perm = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO else Manifest.permission.READ_EXTERNAL_STORAGE
                      if (checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED) {
                          val col = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                          val cur = contentResolver.query(col, arrayOf(MediaStore.Audio.Media._ID),
                              MediaStore.Audio.Media.IS_MUSIC + " != 0", null, null)
                          if (cur != null) {
                              while (cur.moveToNext()) {
                                  list.add(ContentUris.withAppendedId(col, cur.getLong(0)))
                              }
                              cur.close()
                          }
                      }
                  } catch (e: Exception) {}
                  list.shuffle()
                  tracks = list
              }

              private fun playNext() {
                  if (stopped) return
                  try { mp?.release() } catch (e: Exception) {}
                  mp = null
                  if (fails >= 8) return
                  val uri: Uri = if (tracks.isEmpty()) RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM) else tracks[idx % tracks.size]
                  idx++
                  try {
                      val m = MediaPlayer()
                      m.setAudioAttributes(AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                          .build())
                      m.setDataSource(this, uri)
                      m.setOnCompletionListener { playNext() }
                      m.setOnErrorListener { _, _, _ ->
                          fails++
                          h.post { playNext() }
                          true
                      }
                      m.prepare()
                      val v = if (talking) 0.2f else 1.0f
                      m.setVolume(v, v)
                      m.start()
                      mp = m
                      fails = 0
                  } catch (e: Exception) {
                      fails++
                      JuraService.writeLog(this, "Будильник плеер: " + e)
                      h.postDelayed({ playNext() }, 500)
                  }
              }

              private fun cleanup() {
                  stopped = true
                  alive = false
                  h.removeCallbacksAndMessages(null)
                  try { mp?.stop() } catch (e: Exception) {}
                  try { mp?.release() } catch (e: Exception) {}
                  mp = null
                  try { tts?.stop() } catch (e: Exception) {}
                  try { tts?.shutdown() } catch (e: Exception) {}
                  tts = null
                  try { if (wl?.isHeld == true) wl?.release() } catch (e: Exception) {}
              }

              private fun finish() {
                  if (stopped) return
                  cleanup()
                  stopForeground(true)
                  stopSelf()
              }

              override fun onDestroy() {
                  cleanup()
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/com/jura/assistant/Hud.kt <<'EOF'
          package com.jura.assistant

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.View

          class Hud(ctx: Context) : View(ctx) {
              var mode = 0
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val green = Color.parseColor("#39FF14")
              private var t = 0f
              private val rc = RectF()

              private fun glow(w: Float, d: () -> Unit) {
                  p.color = green
                  p.strokeWidth = w * 4f
                  p.alpha = 40
                  d()
                  p.strokeWidth = w
                  p.alpha = 255
                  d()
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  t += 0.04f
                  c.drawColor(Color.parseColor("#000A00"))
                  p.style = Paint.Style.STROKE
                  p.strokeCap = Paint.Cap.ROUND

                  glow(2f) { c.drawLine(w * 0.05f, h * 0.10f, w * 0.95f, h * 0.10f, p) }

                  val cx = w * 0.5f
                  val cy = h * 0.27f
                  val bigR = w * 0.40f
                  glow(3f) { c.drawCircle(cx, cy, bigR * 0.55f, p) }
                  glow(2f) { c.drawCircle(cx, cy, bigR * 0.75f, p) }
                  glow(1.5f) { c.drawCircle(cx, cy, bigR * 0.92f, p) }
                  rc.set(cx - bigR, cy - bigR, cx + bigR, cy + bigR)
                  val rot = t * 40f * (if (mode == 0) 0.2f else 1f)
                  glow(8f) {
                      c.drawArc(rc, rot, 60f, false, p)
                      c.drawArc(rc, rot + 120f, 40f, false, p)
                      c.drawArc(rc, rot + 220f, 70f, false, p)
                  }

                  val mw = w * 0.05f
                  p.color = green
                  p.alpha = 255
                  p.style = Paint.Style.FILL
                  rc.set(cx - mw, cy - mw * 2.2f, cx + mw, cy + mw * 0.6f)
                  c.drawRoundRect(rc, mw, mw, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = w * 0.012f
                  rc.set(cx - mw * 1.7f, cy - mw * 1.4f, cx + mw * 1.7f, cy + mw * 1.6f)
                  c.drawArc(rc, 0f, 180f, false, p)
                  c.drawLine(cx, cy + mw * 1.6f, cx, cy + mw * 2.4f, p)
                  c.drawLine(cx - mw, cy + mw * 2.4f, cx + mw, cy + mw * 2.4f, p)

                  val wy = h * 0.473f
                  val amp = (if (mode == 0) 0.004f else if (mode == 1) 0.02f else 0.055f) * h
                  p.strokeWidth = w * 0.009f
                  for (i in 0..40) {
                      val x = w * 0.12f + (w * 0.76f) * i / 40f
                      val env = 0.25f + 0.75f * (1f - Math.abs(i - 20) / 20f)
                      val s = Math.abs(Math.sin((t * 3f + i * 0.6f).toDouble())).toFloat()
                      val hb = amp * env * (0.35f + 0.65f * s)
                      c.drawLine(x, wy - hb - 2f, x, wy + hb + 2f, p)
                  }

                  rc.set(w * 0.10f, h * 0.50f, w * 0.90f, h * 0.60f)
                  glow(2.5f) { c.drawRoundRect(rc, h * 0.03f, h * 0.03f, p) }

                  for (k in 0..3) {
                      val s = 1f - k * 0.2f
                      rc.set(cx - w * 0.45f * s, h * 0.78f - h * 0.035f * s, cx + w * 0.45f * s, h * 0.78f + h * 0.035f * s)
                      glow(2f) { c.drawOval(rc, p) }
                  }
                  p.color = green
                  p.alpha = 70
                  p.strokeWidth = 1.5f
                  for (i in -6..6) {
                      c.drawLine(cx + i * w * 0.02f, h * 0.80f, cx + i * w * 0.17f, h, p)
                  }
                  for (j in 1..5) {
                      val yy = h * 0.80f + h * 0.2f * j * j / 25f
                      c.drawLine(0f, yy, w, yy, p)
                  }

                  rc.set(w * 0.04f, h * 0.861f, w * 0.96f, h * 0.928f)
                  glow(3f) { c.drawRoundRect(rc, h * 0.034f, h * 0.034f, p) }
                  p.style = Paint.Style.FILL
                  p.color = green
                  p.alpha = 255
                  for (k in 0..2) {
                      c.drawCircle(w * 0.89f, h * (0.8795f + k * 0.0145f), w * 0.008f, p)
                  }

                  p.style = Paint.Style.STROKE
                  p.strokeWidth = w * 0.012f
                  for (k in 0..2) {
                      val yy = h * (0.053f + k * 0.011f)
                      c.drawLine(w * 0.04f, yy, w * 0.13f, yy, p)
                  }
                  val gx = w * 0.92f
                  val gy = h * 0.062f
                  c.drawCircle(gx, gy, w * 0.025f, p)
                  for (k in 0..7) {
                      val a = k * Math.PI / 4
                      val ca = Math.cos(a).toFloat()
                      val sa = Math.sin(a).toFloat()
                      c.drawLine(gx + ca * w * 0.035f, gy + sa * w * 0.035f, gx + ca * w * 0.048f, gy + sa * w * 0.048f, p)
                  }

                  postInvalidateDelayed(40)
              }
          }
