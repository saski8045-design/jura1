          EOF
          cat > app/src/main/java/com/jura/assistant/Prof.kt <<'EOF'
          package com.jura.assistant

          object Prof {
              val names = listOf("Джарвис", "Бас", "Пятница")
              val pitch = listOf(0.6f, 0.4f, 1.15f)
              val rate = listOf(0.92f, 0.85f, 1.05f)
          }
          EOF
          cat > app/src/main/java/com/jura/assistant/MainActivity.kt <<'EOF'
          package com.jura.assistant

          import android.Manifest
          import android.app.Activity
          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.TextView
          import android.widget.Toast

          class Fr(ctx: Context) : ViewGroup(ctx) {
              private val rects = ArrayList<FloatArray>()

              fun put(v: View, x0: Float, y0: Float, x1: Float, y1: Float) {
                  addView(v)
                  rects.add(floatArrayOf(x0, y0, x1, y1))
              }

              override fun onMeasure(w: Int, h: Int) {
                  val ww = View.MeasureSpec.getSize(w)
                  val hh = View.MeasureSpec.getSize(h)
                  setMeasuredDimension(ww, hh)
                  for (i in 0 until childCount) {
                      val r = rects[i]
                      getChildAt(i).measure(
                          View.MeasureSpec.makeMeasureSpec(((r[2] - r[0]) * ww).toInt(), View.MeasureSpec.EXACTLY),
                          View.MeasureSpec.makeMeasureSpec(((r[3] - r[1]) * hh).toInt(), View.MeasureSpec.EXACTLY))
                  }
              }

              override fun onLayout(changed: Boolean, l: Int, t: Int, r: Int, b: Int) {
                  val ww = r - l
                  val hh = b - t
                  for (i in 0 until childCount) {
                      val q = rects[i]
                      getChildAt(i).layout((q[0] * ww).toInt(), (q[1] * hh).toInt(), (q[2] * ww).toInt(), (q[3] * hh).toInt())
                  }
              }
          }

          class MainActivity : Activity() {
              private val h = Handler(Looper.getMainLooper())
              private lateinit var st1: TextView
              private lateinit var st2: TextView
              private val tick = object : Runnable {
                  override fun run() {
                      refresh()
                      h.postDelayed(this, 700)
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = Color.BLACK
                  window.navigationBarColor = Color.BLACK
                  val green = Color.parseColor("#39FF14")
                  val white = Color.WHITE
                  val root = Fr(this)
                  root.setBackgroundColor(Color.parseColor("#000A00"))
                  val bgId = resources.getIdentifier("jura_bg", "drawable", packageName)
                  val hasBg = bgId != 0

                  fun label(t: String, sp: Float, color: Int, bold: Boolean): TextView {
                      val v = TextView(this)
                      v.text = t
                      v.textSize = sp
                      v.setTextColor(color)
                      v.gravity = Gravity.CENTER
                      v.setSingleLine(true)
                      v.ellipsize = TextUtils.TruncateAt.END
                      v.includeFontPadding = false
                      if (bold) v.setTypeface(null, Typeface.BOLD)
                      return v
                  }

                  fun patch(x0: Float, y0: Float, x1: Float, y1: Float, color: String) {
                      val v = View(this)
                      v.setBackgroundColor(Color.parseColor(color))
                      root.put(v, x0, y0, x1, y1)
                  }

                  if (hasBg) {
                      val bg = ImageView(this)
                      bg.scaleType = ImageView.ScaleType.FIT_XY
                      bg.setImageResource(bgId)
                      root.put(bg, 0f, 0f, 1f, 1f)
                      patch(0.352f, 0.0406f, 0.652f, 0.0759f, "#000200")
                      patch(0.2854f, 0.0781f, 0.7134f, 0.0973f, "#010401")
                      patch(0.2378f, 0.5294f, 0.761f, 0.5882f, "#000A00")
                      patch(0.0856f, 0.8824f, 0.2735f, 0.9091f, "#000700")
                  } else {
                      val logo = ImageView(this)
                      logo.scaleType = ImageView.ScaleType.FIT_CENTER
                      logo.setImageResource(R.drawable.ic_logo)
                      root.put(logo, 0.25f, 0.17f, 0.75f, 0.37f)
                  }

                  root.put(label("JURA", 28f, green, true), 0.30f, 0.040f, 0.70f, 0.076f)
                  root.put(label("Ваш голосовой помощник", 12f, white, false), 0.15f, 0.0781f, 0.85f, 0.0973f)
                  st1 = label("", 20f, green, true)
                  st2 = label("", 15f, white, false)
                  root.put(st1, 0.2f, 0.531f, 0.8f, 0.561f)
                  root.put(st2, 0.2f, 0.562f, 0.8f, 0.592f)

                  val toSettings = View.OnClickListener { startActivity(Intent(this, SettingsActivity::class.java)) }
                  val menu = View(this)
                  menu.setOnClickListener(toSettings)
                  root.put(menu, 0.02f, 0.035f, 0.14f, 0.085f)
                  val gear = View(this)
                  gear.setOnClickListener(toSettings)
                  root.put(gear, 0.86f, 0.035f, 0.98f, 0.085f)
                  val dots = View(this)
                  dots.setOnClickListener(toSettings)
                  root.put(dots, 0.84f, 0.872f, 0.96f, 0.918f)
                  val mic = View(this)
                  mic.setOnClickListener { toggle() }
                  root.put(mic, 0.30f, 0.20f, 0.70f, 0.34f)

                  val ed = EditText(this)
                  ed.hint = "Поиск"
                  ed.setHintTextColor(Color.parseColor("#CCFFFFFF"))
                  ed.setTextColor(white)
                  ed.textSize = 16f
                  ed.setBackgroundColor(Color.TRANSPARENT)
                  ed.setSingleLine(true)
                  ed.imeOptions = EditorInfo.IME_ACTION_SEARCH
                  ed.setPadding(0, 0, 0, 0)
                  ed.setOnEditorActionListener { v, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEARCH) {
                          val q = v.text.toString().trim()
                          if (q.isNotEmpty()) {
                              try {
                                  startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(q))))
                              } catch (e: Exception) {}
                          }
                          true
                      } else {
                          false
                      }
                  }
                  root.put(ed, 0.09f, 0.8765f, 0.82f, 0.9135f)

                  setContentView(root)
                  askPerms()
              }

              override fun onResume() {
                  super.onResume()
                  h.removeCallbacks(tick)
                  h.post(tick)
              }

              override fun onPause() {
                  super.onPause()
                  h.removeCallbacks(tick)
              }

              @Suppress("DEPRECATION")
              private fun running(): Boolean {
                  return try {
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      am.getRunningServices(100).any { it.service.className == JuraService::class.java.name }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun refresh() {
                  if (!running()) {
                      st1.text = "JURA выключен"
                      st2.text = "Нажмите на микрофон"
                      return
                  }
                  val p = getSharedPreferences("jura", MODE_PRIVATE)
                  st1.text = p.getString("state", "Загрузка")
                  st2.text = p.getString("phrase", "")
              }

              private fun toggle() {
                  if (running()) {
                      stopService(Intent(this, JuraService::class.java))
                  } else {
                      startJura()
                  }
                  h.postDelayed({ refresh() }, 400)
              }

              private fun startJura() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Откройте настройки (шестерёнка) и нажмите 1", Toast.LENGTH_LONG).show()
                      askPerms()
                      return
                  }
                  startForegroundService(Intent(this, JuraService::class.java))
              }

              private fun askPerms() {
                  val perms = ArrayList<String>()
                  perms.add(Manifest.permission.RECORD_AUDIO)
                  perms.add(Manifest.permission.READ_CONTACTS)
                  perms.add(Manifest.permission.CALL_PHONE)
                  perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (Build.VERSION.SDK_INT >= 33) {
                      perms.add(Manifest.permission.READ_MEDIA_AUDIO)
                  } else {
                      perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  requestPermissions(perms.toTypedArray(), 1)
              }
          }
          EOF
          cat > app/src/main/java/com/jura/assistant/SettingsActivity.kt <<'EOF'
          package com.jura.assistant

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.speech.tts.Voice
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Locale

          class SettingsActivity : Activity() {
              private lateinit var logView: TextView
              private lateinit var voiceView: TextView
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private val green = Color.parseColor("#39FF14")

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = Color.BLACK
                  window.navigationBarColor = Color.BLACK
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.parseColor("#040904"))
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.VERTICAL
                  l.setPadding(48, 96, 48, 64)

                  fun lp(top: Int): LinearLayout.LayoutParams {
                      val p = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      p.topMargin = top
                      return p
                  }

                  fun head(t: String) {
                      val v = TextView(this)
                      v.text = t
                      v.textSize = 18f
                      v.setTextColor(green)
                      v.setTypeface(null, Typeface.BOLD)
                      l.addView(v, lp(48))
                  }

                  fun note(t: String): TextView {
                      val v = TextView(this)
                      v.text = t
                      v.textSize = 14f
                      v.setTextColor(Color.parseColor("#CFE8CF"))
                      l.addView(v, lp(8))
                      return v
                  }

                  fun btn(t: String, a: () -> Unit) {
                      val x = Button(this)
                      x.text = t
                      x.isAllCaps = false
                      x.setTextColor(green)
                      val gd = GradientDrawable()
                      gd.setColor(Color.parseColor("#0A1F0A"))
                      gd.setStroke(3, green)
                      gd.cornerRadius = 48f
                      x.background = gd
                      x.setOnClickListener { a() }
                      l.addView(x, lp(16))
                  }

                  btn("← Назад") { finish() }

                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_logo)
                  val llp = LinearLayout.LayoutParams(260, 260)
                  llp.gravity = Gravity.CENTER_HORIZONTAL
                  llp.topMargin = 24
                  l.addView(logo, llp)
                  val title = TextView(this)
                  title.text = "JURA: настройки"
                  title.textSize = 24f
                  title.setTextColor(green)
                  title.setTypeface(null, Typeface.BOLD)
                  title.gravity = Gravity.CENTER_HORIZONTAL
                  l.addView(title, lp(8))

                  head("Первая настройка")
                  note("Нажмите по порядку 1, 2, 3, 5, потом вернитесь назад и нажмите на микрофон.")
                  btn("1. Дать разрешения") { askPerms() }
                  btn("2. Разрешить поверх других окон") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                  }
                  btn("3. Снять ограничения батареи") {
                      startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                  }
                  btn("5. Доступ к уведомлениям") {
                      startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"))
                  }

                  head("Запуск")
                  btn("4. Запустить Джуру") { startJura() }
                  btn("Остановить") { stopService(Intent(this, JuraService::class.java)) }

                  head("Голос")
                  voiceView = note("")
                  for (i in Prof.names.indices) {
                      btn("Голос: " + Prof.names[i]) { pick(i) }
                  }
                  note("Голосом: «Джура, поменяй голос».")

                  head("Журнал")
                  btn("Обновить журнал") { showLog() }
                  btn("Очистить журнал") {
                      getSharedPreferences("jura", MODE_PRIVATE).edit().remove("log").apply()
                      showLog()
                  }
                  logView = TextView(this)
                  logView.textSize = 12f
                  logView.setTextColor(Color.parseColor("#CFE8CF"))
                  logView.setTextIsSelectable(true)
                  l.addView(logView, lp(16))

                  sv.addView(l)
                  setContentView(sv)
                  tts = TextToSpeech(this) { s ->
                      if (s == TextToSpeech.SUCCESS) {
                          tts?.setLanguage(Locale("ru", "RU"))
                          ttsReady = true
                      }
                  }
                  showLog()
                  showVoice()
              }

              override fun onResume() {
                  super.onResume()
                  showLog()
                  showVoice()
              }

              override fun onDestroy() {
                  try { tts?.shutdown() } catch (e: Exception) {}
                  super.onDestroy()
              }

              private fun showLog() {
                  logView.text = getSharedPreferences("jura", MODE_PRIVATE).getString("log", "Журнал пуст")
              }

              private fun showVoice() {
                  val i = getSharedPreferences("jura", MODE_PRIVATE).getInt("profile", 0).coerceIn(0, Prof.names.size - 1)
                  voiceView.text = "Сейчас: " + Prof.names[i]
              }

              private fun ruVoices(t: TextToSpeech): List<Voice> {
                  return try {
                      val all = t.voices ?: emptySet<Voice>()
                      all.filter {
                          it.locale.language == "ru" &&
                              !it.features.contains(TextToSpeech.Engine.KEY_FEATURE_NOT_INSTALLED)
                      }.sortedBy { it.name }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun pick(i: Int) {
                  getSharedPreferences("jura", MODE_PRIVATE).edit().putInt("profile", i).remove("pitch").remove("rate").apply()
                  showVoice()
                  val t = tts
                  if (t == null || !ttsReady) return
                  try {
                      val vs = ruVoices(t)
                      if (vs.isNotEmpty()) t.voice = vs[i % vs.size]
                  } catch (e: Exception) {}
                  t.setPitch(Prof.pitch[i])
                  t.setSpeechRate(Prof.rate[i])
                  t.speak("Я Джура, к вашим услугам, сэр.", TextToSpeech.QUEUE_FLUSH, null, "p")
              }

              private fun startJura() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Сначала нажмите 1 и разрешите микрофон", Toast.LENGTH_LONG).show()
                      askPerms()
                      return
                  }
                  startForegroundService(Intent(this, JuraService::class.java))
              }

              private fun askPerms() {
                  val perms = ArrayList<String>()
                  perms.add(Manifest.permission.RECORD_AUDIO)
                  perms.add(Manifest.permission.READ_CONTACTS)
                  perms.add(Manifest.permission.CALL_PHONE)
                  perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (Build.VERSION.SDK_INT >= 33) {
                      perms.add(Manifest.permission.READ_MEDIA_AUDIO)
                  } else {
                      perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  requestPermissions(perms.toTypedArray(), 1)
              }
          }
          EOF
          cat > app/src/main/java/com/jura/assistant/JuraNotif.kt <<'EOF'
          package com.jura.assistant

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          object NotifStore {
              class Item(val pkg: String, val who: String, val text: String)

              val whatsapp = listOf("com.whatsapp", "com.whatsapp.w4b")
              val instagram = listOf("com.instagram.android")
