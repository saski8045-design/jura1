                  showLog()
                  showVoice()
                  showMem()
                  showWake()
              }

              override fun onDestroy() {
                  try { tts?.shutdown() } catch (e: Exception) {}
                  super.onDestroy()
              }

              private fun showLog() {
                  logView.text = getSharedPreferences("jura", MODE_PRIVATE).getString("log", "Журнал пуст")
              }

              private fun showMem() {
                  val n = (getSharedPreferences("jura", MODE_PRIVATE).getString("notes", "") ?: "").split("\n").filter { it.isNotBlank() }.size
                  memView.text = "Заметок в памяти: " + n + ". Голосом: «запомни, что ...», «что ты помнишь», «забудь всё»."
              }

              private fun showWake() {
                  val at = getSharedPreferences("jura", MODE_PRIVATE).getLong("wake_at", 0L)
                  wakeView.text = if (at > System.currentTimeMillis()) {
                      "Следующий: " + SimpleDateFormat("d MMMM, HH:mm", Locale("ru", "RU")).format(Date(at))
                  } else {
                      "Не установлен. Голосом: «Джура, разбуди меня в семь тридцать»."
                  }
              }

              private fun showVoice() {
                  val i = getSharedPreferences("jura", MODE_PRIVATE).getInt("profile", 0).coerceIn(0, Prof.names.size - 1)
                  voiceView.text = "Сейчас: " + Prof.names[i]
              }

              private fun ruVoices(t: TextToSpeech): List<Voice> {
                  return try {
                      val all = t.getVoices() ?: emptySet<Voice>()
                      all.filter {
                          it.locale.language == "ru" &&
                              !it.features.contains(TextToSpeech.Engine.KEY_FEATURE_NOT_INSTALLED)
                      }.sortedBy { it.name }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun pick(i: Int) {
                  getSharedPreferences("jura", MODE_PRIVATE).edit().putInt("profile", i).remove("pitch").remove("rate").apply()
                  showVoice()
                  val t = tts
                  if (t == null || !ttsReady) return
                  try {
                      val vs = ruVoices(t)
                      if (vs.isNotEmpty()) t.setVoice(vs[i % vs.size])
                  } catch (e: Exception) {}
                  t.setPitch(Prof.pitch[i])
                  t.setSpeechRate(Prof.rate[i])
                  t.speak("Я Джура, к вашим услугам, сэр.", TextToSpeech.QUEUE_FLUSH, null, "p")
              }

              private fun startJura() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Сначала нажмите 1 и разрешите микрофон", Toast.LENGTH_LONG).show()
                      askPerms()
                      return
                  }
                  startForegroundService(Intent(this, JuraService::class.java))
              }

              private fun askPerms() {
                  val perms = ArrayList<String>()
                  perms.add(Manifest.permission.RECORD_AUDIO)
                  perms.add(Manifest.permission.READ_CONTACTS)
                  perms.add(Manifest.permission.CALL_PHONE)
                  perms.add(Manifest.permission.SEND_SMS)
                  perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (Build.VERSION.SDK_INT >= 33) {
                      perms.add(Manifest.permission.READ_MEDIA_AUDIO)
                  } else {
                      perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  requestPermissions(perms.toTypedArray(), 1)
              }
          }
