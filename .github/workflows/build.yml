              private fun handle(raw: String) {
                  val t = raw.lowercase(ru).trim()
                  var cmd = t
                  var named = awaiting
                  if (!awaiting) {
                      val keys = listOf("джарвис", "жарвис", "джур", "жур", "дюр", "юра", "дур", "жор")
                      var idx = -1
                      var len = 0
                      for (k in keys) {
                          val p = t.indexOf(k)
                          if (p >= 0 && (idx < 0 || p < idx)) { idx = p; len = k.length }
                      }
                      if (idx >= 0) {
                          named = true
                          cmd = t.substring(idx + len)
                          if (cmd.isNotEmpty() && "аеуыи".indexOf(cmd[0]) >= 0 && (cmd.length == 1 || !cmd[1].isLetter())) {
                              cmd = cmd.substring(1)
                          }
                      }
                  }
                  cmd = cmd.trim(' ', ',', '.', '!')
                  if (!named && musicOn()) return
                  if (named && cmd.isEmpty()) {
                      awaiting = true
                      speak("Слушаю, сэр.", false)
                      return
                  }
                  awaiting = false
                  if (cmd.isEmpty()) return
                  if (!exec(cmd) && named) {
                      speak("Простите, сэр, я не понял команду. Я услышал: " + cmd + ".", false)
                  }
              }

              private fun exec(c: String): Boolean {
                  if (musicCmd(c)) return true
                  val call = Regex("^(позвони|набери|звони|позвонить)\\s+(.+)$").find(c)
                  val open = Regex("^(открой|открыть|запусти|зайди в|зайди|включи)\\s+(в\\s+)?(.+)$").find(c)
                  val yt = Regex("^(найди|найти|поищи|ищи)\\s+в\\s+(?:ютубе|ютуб|youtube)\\s+(.+)$").find(c)
                  val gs = Regex("^(найди|найти|поищи|ищи|загугли)\\s+(?:в\\s+(?:гугле|гугл|интернете|google)\\s+)?(.+)$").find(c)
                  when {
                      call != null -> callContact(call.groupValues[2])
                      open != null -> openApp(open.groupValues[3])
                      yt != null -> webSearch(yt.groupValues[2], true)
                      gs != null -> webSearch(gs.groupValues[2], false)
                      c.contains("повтор") -> {
                          if (last.isEmpty()) speak("Мне нечего повторять, сэр.", false) else speak(last)
                      }
                      c.contains("домой") || c.startsWith("закрой") || c.contains("сверни") -> goHome()
                      c.contains("добр") && c.contains("утр") -> weather(true)
                      c.contains("погод") -> weather(false)
                      c.contains("голос") && (c.contains("смени") || c.contains("поменя") || c.contains("измени") || c.contains("друго")) -> changeVoice()
                      c.contains("ниже") && (c.contains("говори") || c.contains("голос")) -> tune(-0.15f, 0f, "Говорю ниже, сэр.")
                      c.contains("выше") && (c.contains("говори") || c.contains("голос")) -> tune(0.15f, 0f, "Говорю выше, сэр.")
                      c.contains("быстрее") && c.contains("говори") -> tune(0f, 0.15f, "Говорю быстрее, сэр.")
                      c.contains("медленнее") && c.contains("говори") -> tune(0f, -0.15f, "Говорю медленнее, сэр.")
                      c.contains("написал") || c.contains("сообщени") || c.contains("уведомлен") || c.startsWith("прочитай") -> readNotifs(c)
                      c.contains("умеешь") -> speak("Я умею говорить время и дату, звонить контактам, открывать приложения, включать музыку, искать в гугле и в ютубе, говорить погоду, читать сообщения из мессенджеров и менять голос, сэр.")
                      c.contains("врем") -> {
                          val cal = Calendar.getInstance()
                          speak("Сейчас " + cal.get(Calendar.HOUR_OF_DAY) + " " + "%02d".format(cal.get(Calendar.MINUTE)) + ", сэр.")
                      }
                      c.contains("дата") || c.contains("число") || c.contains("день") -> {
                          speak("Сегодня " + SimpleDateFormat("EEEE, d MMMM yyyy", ru).format(Date()) + ", сэр.")
                      }
                      else -> return false
                  }
                  return true
              }

              private fun musicOn(): Boolean {
                  return try { player?.isPlaying == true } catch (e: Exception) { false }
              }

              private fun duck(on: Boolean) {
                  try {
                      val v = if (on) 0.15f else musicVol
                      player?.setVolume(v, v)
                  } catch (e: Exception) {}
              }

              private fun hasAudioPerm(): Boolean {
                  val p = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO else Manifest.permission.READ_EXTERNAL_STORAGE
                  return checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED
              }

              private fun loadTracks(): Boolean {
                  val list = ArrayList<Pair<Uri, String>>()
                  try {
                      val col = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                      val cur = contentResolver.query(
                          col,
                          arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST),
                          MediaStore.Audio.Media.IS_MUSIC + " != 0", null, null)
                      if (cur != null) {
                          while (cur.moveToNext()) {
                              val id = cur.getLong(0)
                              val title = cur.getString(1) ?: ""
                              val artist = cur.getString(2) ?: ""
                              val name = if (artist.isBlank() || artist == "<unknown>") title else artist + " - " + title
                              list.add(Pair(ContentUris.withAppendedId(col, id), name))
                          }
                          cur.close()
                      }
                  } catch (e: Exception) { log("Музыка: " + e) }
                  list.shuffle()
                  tracks = list
                  log("Песен найдено: " + list.size)
                  return list.isNotEmpty()
              }

              private fun stopMusic() {
                  try { player?.stop() } catch (e: Exception) {}
                  try { player?.release() } catch (e: Exception) {}
                  player = null
              }

              private fun musicFailed() {
                  musicFail++
                  if (musicFail < 5) {
                      trackIdx++
                      h.postDelayed({ playTrack() }, 300)
                  } else {
                      musicFail = 0
                      stopMusic()
                      speak("Не удаётся воспроизвести музыку, сэр.")
                  }
              }

              private fun playTrack() {
                  if (tracks.isEmpty() || !running) return
                  stopMusic()
                  val t = tracks[trackIdx % tracks.size]
                  try {
                      val mp = MediaPlayer()
                      mp.setAudioAttributes(AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                          .build())
                      mp.setDataSource(this, t.first)
                      mp.setOnCompletionListener {
                          trackIdx++
                          playTrack()
                      }
                      mp.setOnErrorListener { _, _, _ ->
                          h.post { musicFailed() }
                          true
                      }
                      mp.prepare()
                      val v = if (speaking) 0.15f else musicVol
                      mp.setVolume(v, v)
                      mp.start()
                      player = mp
                      musicFail = 0
                      log("Играет: " + t.second)
                  } catch (e: Exception) {
                      log("Плеер: " + e)
                      musicFailed()
                  }
              }

              private fun startMusic() {
                  if (!hasAudioPerm()) {
                      speak("Нет доступа к музыке, сэр. Откройте настройки и нажмите кнопку один.")
                      return
                  }
                  if (!loadTracks()) {
                      speak("Музыку на телефоне не нашёл, сэр.")
                      return
                  }
                  trackIdx = 0
                  musicFail = 0
                  speak("Включаю музыку, сэр. Песен найдено: " + tracks.size + ".", false)
                  h.postDelayed({ playTrack() }, 2500)
              }

              private fun volume(up: Boolean) {
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val d = if (up) AudioManager.ADJUST_RAISE else AudioManager.ADJUST_LOWER
                      am.adjustStreamVolume(AudioManager.STREAM_MUSIC, d, 0)
                      am.adjustStreamVolume(AudioManager.STREAM_MUSIC, d, 0)
                  } catch (e: Exception) { log("Громкость: " + e) }
              }

              private fun musicCmd(c: String): Boolean {
                  val has = player != null
                  val about = c.contains("музык") || c.contains("песн") || c.contains("трек")
                  when {
                      about && (c.contains("стоп") || c.contains("выключ") || c.contains("останов") || c.contains("хватит") || c.contains("отключ")) -> {
                          stopMusic()
                          speak("Музыка выключена, сэр.", false)
                      }
                      has && c.contains("пауз") -> {
                          try { player?.pause() } catch (e: Exception) {}
                      }
                      has && c.contains("продолж") -> {
                          try { player?.start() } catch (e: Exception) {}
                      }
                      has && (c.contains("следующ") || c.contains("дальше") || (c.contains("друг") && about)) -> {
                          trackIdx++
                          playTrack()
                      }
                      has && (c.contains("предыдущ") || c.contains("прошл")) -> {
                          trackIdx = if (trackIdx > 0) trackIdx - 1 else 0
                          playTrack()
                      }
                      has && (c.contains("что играет") || c.contains("какая песня") || c.contains("как называется")) -> {
                          speak("Играет " + tracks[trackIdx % tracks.size].second + ", сэр.", false)
                      }
                      c.contains("громче") -> volume(true)
                      c.contains("тише") -> volume(false)
                      about && (c.contains("постав") || c.contains("включ") || c.contains("запуст") || c.contains("играй") || c.contains("найди")) -> startMusic()
                      c.contains("музык") -> startMusic()
                      else -> return false
                  }
                  return true
              }

              private fun webSearch(q: String, youtube: Boolean) {
                  val url = if (youtube) "https://www.youtube.com/results?search_query=" + Uri.encode(q)
                  else "https://www.google.com/search?q=" + Uri.encode(q)
                  speak(if (youtube) "Ищу в ютубе, сэр." else "Ищу в гугле, сэр.")
                  h.postDelayed({
                      try {
                          val i = Intent(Intent.ACTION_VIEW, Uri.parse(url))
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(i)
                      } catch (e: Exception) { log("Поиск: " + e) }
                  }, 1500)
              }

              private fun goHome() {
                  speak("Сворачиваю, сэр.")
                  h.postDelayed({
                      try {
                          val i = Intent(Intent.ACTION_MAIN)
                          i.addCategory(Intent.CATEGORY_HOME)
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(i)
                      } catch (e: Exception) { log("Домой: " + e) }
                  }, 1200)
              }

              private fun tempWord(t: Int): String {
                  val a = Math.abs(t)
                  val w = if (a % 10 == 1 && a % 100 != 11) "градус"
                  else if (a % 10 in 2..4 && a % 100 !in 12..14) "градуса"
                  else "градусов"
                  return (if (t < 0) "минус " else "") + a + " " + w
              }

              private fun codeWord(c: Int): String {
                  return when {
                      c == 0 -> "ясно"
                      c in 1..2 -> "переменная облачность"
                      c == 3 -> "пасмурно"
                      c == 45 || c == 48 -> "туман"
                      c in 51..57 -> "морось"
                      c in 61..67 -> "дождь"
                      c in 71..77 -> "снег"
                      c in 80..82 -> "ливень"
                      c in 85..86 -> "снегопад"
                      c >= 95 -> "гроза"
                      else -> "без осадков"
                  }
              }

              private fun weather(greet: Boolean) {
                  Thread {
                      var msg = ""
                      try {
                          val u = URL("https://api.open-meteo.com/v1/forecast?latitude=38.5598&longitude=68.7870&current=temperature_2m,weather_code&timezone=auto")
                          val con = u.openConnection() as HttpURLConnection
                          con.connectTimeout = 6000
                          con.readTimeout = 6000
                          val body = con.inputStream.bufferedReader().use { it.readText() }
                          val cur = JSONObject(body).getJSONObject("current")
                          val t = Math.round(cur.getDouble("temperature_2m")).toInt()
                          val code = cur.getInt("weather_code")
                          msg = "В Душанбе сейчас " + tempWord(t) + ", " + codeWord(code) + "."
                      } catch (e: Exception) {
                          log("Погода: " + e)
                          msg = "Не удалось узнать погоду, сэр."
                      }
                      val out = if (greet) "Доброе утро, сэр. " + msg else msg
                      h.post { speak(out) }
                  }.start()
              }

              private fun readNotifs(c: String) {
                  val enabled = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                  if (!enabled.contains(packageName)) {
                      speak("Нет доступа к уведомлениям, сэр. Откройте настройки и нажмите кнопку пять.")
                      return
                  }
                  var pk = NotifStore.watched
                  var name = "мессенджерах"
                  when {
                      c.contains("ватсап") || c.contains("вацап") || c.contains("whatsapp") -> { pk = NotifStore.whatsapp; name = "WhatsApp" }
                      c.contains("инст") || c.contains("грамм") -> { pk = NotifStore.instagram; name = "Instagram" }
                      c.contains("телег") -> { pk = NotifStore.telegram; name = "Telegram" }
                  }
                  val list = NotifStore.recent(pk, 5)
                  if (list.isEmpty()) {
                      speak("В " + name + " новых сообщений нет, сэр.")
                      return
                  }
                  val sb = StringBuilder("В " + name + ": ")
                  for (m in list) {
                      sb.append(m.who).append(": ").append(m.text.take(150)).append(". ")
                  }
                  speak(sb.toString())
              }

              private fun callContact(q: String) {
                  val qs = q.split(" ").filter { it.length > 1 }
                  var best: String? = null
                  var bestName = ""
                  var bestScore = 0
                  try {
                      val cur = contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER),
                          null, null, null)
                      if (cur != null) {
                          while (cur.moveToNext()) {
                              val name = cur.getString(0) ?: continue
                              val words = name.lowercase(ru).split(" ")
                              var score = 0
                              var ok = qs.isNotEmpty()
                              for (w in qs) {
                                  var m = 0
                                  for (x in words) {
                                      var k = 0
                                      while (k < w.length && k < x.length && w[k] == x[k]) k++
                                      if (k > m) m = k
                                  }
                                  if (m >= minOf(3, w.length)) score += m else ok = false
                              }
                              if (ok && score > bestScore) {
                                  bestScore = score
                                  best = cur.getString(1)
                                  bestName = name
                              }
                          }
                          cur.close()
                      }
                  } catch (e: Exception) { log("Контакты: " + e) }
                  val num = best
                  if (num == null) {
                      speak("Не нашёл контакт " + q + ", сэр.")
                      return
                  }
                  speak("Звоню, " + bestName + ", сэр.")
                  h.postDelayed({
                      try {
                          getSystemService(TelecomManager::class.java).placeCall(Uri.fromParts("tel", num, null), Bundle())
                      } catch (e: Exception) {
                          log("Звонок: " + e)
                          speak("Не удалось позвонить, сэр.")
                      }
                  }, 1800)
              }

              private fun openApp(q0: String) {
                  val raw = q0.trim()
                  val alias = listOf(
                      "ютуб" to "youtube", "ютьюб" to "youtube",
                      "ватсап" to "whatsapp", "вацап" to "whatsapp", "вотсап" to "whatsapp",
                      "телеграм" to "telegram", "хром" to "chrome",
                      "гугл" to "google", "плей маркет" to "play",
                      "инста" to "instagram", "грамм" to "instagram",
                      "чат" to "chatgpt",
                      "клод" to "claude", "клауд" to "claude",
                      "легенд" to "mobile legends", "мобайл" to "mobile legends",
                      "дота" to "dota")
                  var q = raw
                  for (a in alias) {
                      if (raw.contains(a.first)) { q = a.second; break }
                  }
                  val pkgs = mapOf(
                      "instagram" to "com.instagram.android",
                      "chatgpt" to "com.openai.chatgpt",
                      "claude" to "com.anthropic.claude",
                      "mobile legends" to "com.mobile.legends",
                      "whatsapp" to "com.whatsapp",
                      "telegram" to "org.telegram.messenger",
                      "youtube" to "com.google.android.youtube")
                  val pm = packageManager
                  val list = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                  var pkg: String? = null
                  for (r in list) {
                      val label = r.loadLabel(pm).toString().lowercase(ru)
                      if (label.contains(q) || (q.length > 3 && q.contains(label))) {
                          pkg = r.activityInfo.packageName
                          break
                      }
                  }
                  var li = if (pkg != null) pm.getLaunchIntentForPackage(pkg) else null
                  if (li == null) {
                      val fb = pkgs[q]
                      if (fb != null) li = pm.getLaunchIntentForPackage(fb)
                  }
                  val go = li
                  if (go == null) {
                      speak("Не нашёл приложение " + q0 + ", сэр.")
                      return
                  }
                  speak("Открываю, сэр.")
                  h.postDelayed({
                      go.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      try { startActivity(go) } catch (e: Exception) { log("Запуск: " + e) }
                  }, 1300)
              }

              override fun onDestroy() {
                  log("Служба остановлена")
                  running = false
                  setState("stopped", "")
                  try { getSharedPreferences("jura", MODE_PRIVATE).unregisterOnSharedPreferenceChangeListener(prefListener) } catch (e: Exception) {}
                  h.removeCallbacksAndMessages(null)
                  stopMusic()
                  try { svc?.stop() } catch (e: Exception) {}
                  try { svc?.shutdown() } catch (e: Exception) {}
                  try { model?.close() } catch (e: Exception) {}
                  tts?.shutdown()
                  try { if (wl?.isHeld == true) wl?.release() } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          EOF
      - name: Add background image
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          BG=$(ls *.png *.jpg *.jpeg 2>/dev/null | head -n 1 || true)
          if [ -n "$BG" ]; then
            EXT="${BG##*.}"
            if [ "$EXT" = "jpeg" ]; then EXT=jpg; fi
            cp "$BG" "app/src/main/res/drawable-nodpi/jura_bg.$EXT"
            echo "Background: $BG"
          else
            echo "No background image found"
          fi
      - name: Download speech model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip
          mv vosk-model-small-ru-0.22 app/src/main/assets/model-ru
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/model-ru/uuid
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --title "Jura v${{ github.run_number }}" --notes "Jura APK"
